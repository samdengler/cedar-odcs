<style>
/* dg core styles */
[data-diagram] { position: relative; --dg-stroke: #546170; --dg-bg: #ffffff; --dg-accent: #eef2f7; }
[data-sequence] { --dg-stroke: #546170; --dg-bg: #ffffff; --dg-accent: #eef2f7; }
.dg-grid { display: grid; gap: 64px 56px; justify-content: center; align-items: center; justify-items: center; padding: 12px; }
.dg-node { border: 1.5px solid #546170; border-radius: 8px; background: #eef2f7; padding: 10px 18px;
           font-size: 13px; font-weight: 600; text-align: center; min-width: 110px; box-sizing: border-box; }
.dg-node small { display: block; font-weight: 400; color: #5b6a7a; margin-top: 2px; font-size: 11px; }
.dg-diamond { border: none; background: none; padding: 24px 20px; position: relative; min-width: 130px; }
.dg-diamond::before { content: ''; position: absolute; inset: 0; background: #fdf3dc; border: 1.5px solid #b9985a;
                      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); z-index: -1; }
.dg-group { border: 1.5px dashed #8a97a5; border-radius: 10px; padding: 30px 20px 20px; position: relative; }
.dg-group-label { position: absolute; top: 8px; left: 12px; font-size: 11px; font-weight: 700;
                  text-transform: uppercase; letter-spacing: .06em; color: #6b7887; }

/* document theme, as in learn/ */
:root { --navy: #003366; --navy-deep: #00274D; --red: #C01933; --ink: #26313c; --muted: #5b6a7a; --light: #E9EEF5; --rule: #d8e0ea; }
body { margin: 0; padding: 24px; background: #fff; color: var(--ink);
       font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.figure { display: inline-block; margin: 0 0 32px; padding: 18px 24px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; }
[data-diagram] { --dg-stroke: #4a5d74; }
[data-sequence] { --dg-stroke: #4a5d74; --dg-accent: #E9EEF5; }
.dg-node { border-color: var(--navy); background: var(--light); color: var(--navy-deep); }
.dg-node small { color: #4a5d74; }
.dg-node.red { border-color: var(--red); background: #FBEDEF; color: #7c0f22; }
.dg-node.red small { color: #962b3b; }
.dg-node.wide { max-width: 250px; }
.dg-node.wide small { text-align: left; }
.stripped { color: #962b3b; }
.dg-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #6b7887; align-self: end; }
code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .95em; }
</style>
</head>

<script>
/* dg-runtime v1 — declarative diagram runtime.
 * Nodes are HTML elements laid out by CSS grid; this script draws orthogonal
 * SVG connectors, arrowheads, and haloed labels from MEASURED positions.
 * It never requires hand-computed coordinates.
 * Emits warnings to window.__diagramWarnings + console.warn on geometry violations.
 */
(function () {
  'use strict';
  const CLEAR = 12;          // min clearance between an edge segment and unrelated node
  const STUB = 18;           // perpendicular stub leaving/entering a node
  const ARROW = 7;           // arrowhead length
  const LABEL_PAD = 3;       // halo padding
  window.__diagramWarnings = window.__diagramWarnings || [];
  function warn(msg) { window.__diagramWarnings.push(msg); console.warn('[diagram] ' + msg); }

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function rectsOverlap(a, b, pad) {
    pad = pad || 0;
    return a.x < b.x + b.w + pad && a.x + a.w + pad > b.x &&
           a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;
  }
  function segHitsRect(x1, y1, x2, y2, r, pad) {
    // axis-aligned segment vs rect (inflated by pad); tolerant of float noise
    const rx = r.x - pad, ry = r.y - pad, rw = r.w + 2 * pad, rh = r.h + 2 * pad;
    if (Math.abs(x1 - x2) < 0.5) { // vertical
      if (x1 <= rx || x1 >= rx + rw) return false;
      const lo = Math.min(y1, y2), hi = Math.max(y1, y2);
      return hi > ry && lo < ry + rh;
    } else { // horizontal
      if (y1 <= ry || y1 >= ry + rh) return false;
      const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
      return hi > rx && lo < rx + rw;
    }
  }

  function renderDiagram(container) {
    const nodes = {};
    container.querySelectorAll('.dg-node').forEach(n => {
      if (!n.id) { warn('node missing id: "' + n.textContent.trim().slice(0, 30) + '"'); return; }
      nodes[n.id] = n;
    });
    const edgeScript = container.querySelector('script.dg-edges');
    if (!edgeScript) return;
    let edges;
    try { edges = JSON.parse(edgeScript.textContent); }
    catch (e) { warn('bad edge JSON: ' + e.message); return; }

    const cRect = container.getBoundingClientRect();
    const R = {}; // measured rects, container-relative
    for (const id in nodes) {
      const b = nodes[id].getBoundingClientRect();
      R[id] = { x: b.left - cRect.left, y: b.top - cRect.top, w: b.width, h: b.height,
                cx: b.left - cRect.left + b.width / 2, cy: b.top - cRect.top + b.height / 2,
                diamond: nodes[id].classList.contains('dg-diamond') };
    }
    // node-node overlap check
    const ids = Object.keys(R);
    for (let i = 0; i < ids.length; i++)
      for (let j = i + 1; j < ids.length; j++) {
        const a = nodes[ids[i]], b = nodes[ids[j]];
        if (a.contains(b) || b.contains(a)) continue;
        if (rectsOverlap(R[ids[i]], R[ids[j]], 0)) warn('nodes overlap: ' + ids[i] + ' & ' + ids[j]);
      }

    // ---- choose sides ----
    edges.forEach(e => {
      if (!R[e.from] || !R[e.to]) { e._skip = true; warn('edge references missing node: ' + e.from + '->' + e.to); return; }
      const s = R[e.from], t = R[e.to];
      if (!e.fromSide || !e.toSide) {
        const dx = t.cx - s.cx, dy = t.cy - s.cy;
        const differentRows = t.y >= s.y + s.h || s.y >= t.y + t.h;
        const differentCols = t.x >= s.x + s.w || s.x >= t.x + t.w;
        // Flowchart convention: branches leave a decision diamond sideways when
        // the target sits in another column, keeping branch labels apart.
        if (s.diamond && differentRows && differentCols) {
          e.fromSide = dx > 0 ? 'right' : 'left';
          e.toSide = e.toSide || (dy > 0 ? 'top' : 'bottom');
          return;
        }
        // Prefer vertical routing whenever the nodes occupy different rows:
        // the gap between grid rows is a guaranteed-clear channel, while a
        // horizontal route across rows must pass through other columns.
        if (differentRows || Math.abs(dy) >= Math.abs(dx)) {
          e.fromSide = e.fromSide || (dy > 0 ? 'bottom' : 'top');
          e.toSide = e.toSide || (dy > 0 ? 'top' : 'bottom');
        } else {
          e.fromSide = e.fromSide || (dx > 0 ? 'right' : 'left');
          e.toSide = e.toSide || (dx > 0 ? 'left' : 'right');
        }
      }
    });

    // ---- assign ports (fan out multiple edges on the same side) ----
    const sideGroups = {};
    edges.forEach(e => {
      if (e._skip) return;
      [['from', e.fromSide], ['to', e.toSide]].forEach(([end, side]) => {
        const id = e[end], key = id + ':' + side;
        (sideGroups[key] = sideGroups[key] || []).push({ e, end });
      });
    });
    // Ports project toward the counterpart node (straight lines when aligned),
    // clamped to the side and spread apart when several edges share a side.
    for (const key in sideGroups) {
      const g = sideGroups[key];
      const [id, side] = key.split(':');
      const r = R[id];
      const vertSide = side === 'top' || side === 'bottom';
      const lo = vertSide ? r.x + 14 : r.y + 12;
      const hi = vertSide ? r.x + r.w - 14 : r.y + r.h - 12;
      g.forEach(entry => {
        const other = R[entry.end === 'from' ? entry.e.to : entry.e.from];
        entry._want = Math.max(lo, Math.min(vertSide ? other.cx : other.cy, hi));
      });
      g.sort((a, b) => a._want - b._want);
      const MIN = 20;
      for (let i = 1; i < g.length; i++)
        if (g[i]._want - g[i - 1]._want < MIN) g[i]._want = g[i - 1]._want + MIN;
      for (let i = g.length - 1; i >= 0; i--) {
        const cap = hi - (g.length - 1 - i) * MIN;
        if (g[i]._want > cap) g[i]._want = cap;
      }
      g.forEach(entry => {
        const w = r.diamond ? (vertSide ? r.x + r.w / 2 : r.y + r.h / 2) : entry._want;
        entry.e['_' + entry.end] = vertSide
          ? { x: w, y: side === 'top' ? r.y : r.y + r.h }
          : { x: side === 'left' ? r.x : r.x + r.w, y: w };
      });
    }

    // ---- route ----
    const obstacles = ids.map(id => R[id]);
    function clearMid(fixedLo, fixedHi, tryVal, axis, exclude, lo, hi) {
      // find a value for the cross segment that avoids obstacles; scan outward
      for (let off = 0; off <= 120; off += 8) {
        for (const cand of off === 0 ? [tryVal] : [tryVal - off, tryVal + off]) {
          if (cand < lo || cand > hi) continue;
          let ok = true;
          for (const r of obstacles) {
            if (exclude.indexOf(r) !== -1) continue;
            const hit = axis === 'y'
              ? segHitsRect(fixedLo, cand, fixedHi, cand, r, CLEAR)
              : segHitsRect(cand, fixedLo, cand, fixedHi, r, CLEAR);
            if (hit) { ok = false; break; }
          }
          if (ok) return cand;
        }
      }
      return tryVal;
    }
    function segsClear(pts, exclude) {
      for (let i = 0; i < pts.length - 1; i++)
        for (const r of obstacles) {
          if (exclude.indexOf(r) !== -1) continue;
          if (segHitsRect(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, r, 4)) return false;
        }
      return true;
    }
    function route(e) {
      const p = e._from, q = e._to, s = R[e.from], t = R[e.to];
      const fs = e.fromSide, ts = e.toSide;
      const dir = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] };
      const p2 = { x: p.x + dir[fs][0] * STUB, y: p.y + dir[fs][1] * STUB };
      const q2 = { x: q.x + dir[ts][0] * STUB, y: q.y + dir[ts][1] * STUB };
      const vertical = fs === 'top' || fs === 'bottom';
      const tVertical = ts === 'top' || ts === 'bottom';
      const X = [s, t];
      let pts = [ { x: p.x, y: p.y } ];
      if (vertical && tVertical) {
        if ((fs === 'bottom') !== (ts === 'bottom')) { // opposing sides
          if (Math.abs(p.x - q.x) < 1 && segsClear([p, q], X)) { pts.push({ x: q.x, y: q.y }); return pts; }
          let midY = (p2.y + q2.y) / 2;
          midY = clearMid(Math.min(p.x, q.x), Math.max(p.x, q.x), midY, 'y', X,
                          Math.min(p2.y, q2.y), Math.max(p2.y, q2.y));
          const z = [pts[0], { x: p.x, y: midY }, { x: q.x, y: midY }, { x: q.x, y: q.y }];
          if (segsClear(z, X)) return z;
          // detour: sidestep around whatever blocks the direct channel
          const y1 = p2.y, y2 = q2.y;
          for (let off = 0; off <= 400; off += 12) {
            for (const cand of off === 0 ? [(p.x + q.x) / 2] : [(p.x + q.x) / 2 - off, (p.x + q.x) / 2 + off]) {
              const d = [pts[0], { x: p.x, y: y1 }, { x: cand, y: y1 }, { x: cand, y: y2 }, { x: q.x, y: y2 }, { x: q.x, y: q.y }];
              if (segsClear(d, X)) return d;
            }
          }
          return z;
        } else { // same side: U route
          const extY = fs === 'bottom' ? Math.max(p2.y, q2.y) : Math.min(p2.y, q2.y);
          pts.push({ x: p.x, y: extY }, { x: q.x, y: extY }, { x: q.x, y: q.y });
        }
      } else if (!vertical && !tVertical) {
        if ((fs === 'right') !== (ts === 'right')) {
          if (Math.abs(p.y - q.y) < 1 && segsClear([p, q], X)) { pts.push({ x: q.x, y: q.y }); return pts; }
          let midX = (p2.x + q2.x) / 2;
          midX = clearMid(Math.min(p.y, q.y), Math.max(p.y, q.y), midX, 'x', X,
                          Math.min(p2.x, q2.x), Math.max(p2.x, q2.x));
          const z = [pts[0], { x: midX, y: p.y }, { x: midX, y: q.y }, { x: q.x, y: q.y }];
          if (segsClear(z, X)) return z;
          const x1 = p2.x, x2 = q2.x;
          for (let off = 0; off <= 400; off += 12) {
            for (const cand of off === 0 ? [(p.y + q.y) / 2] : [(p.y + q.y) / 2 - off, (p.y + q.y) / 2 + off]) {
              const d = [pts[0], { x: x1, y: p.y }, { x: x1, y: cand }, { x: x2, y: cand }, { x: x2, y: q.y }, { x: q.x, y: q.y }];
              if (segsClear(d, X)) return d;
            }
          }
          return z;
        } else {
          const extX = fs === 'right' ? Math.max(p2.x, q2.x) : Math.min(p2.x, q2.x);
          pts.push({ x: extX, y: p.y }, { x: extX, y: q.y }, { x: q.x, y: q.y });
        }
      } else { // L route (one vertical, one horizontal), with elbow fallback
        const L = vertical
          ? [pts[0], { x: p.x, y: q.y }, { x: q.x, y: q.y }]
          : [pts[0], { x: q.x, y: p.y }, { x: q.x, y: q.y }];
        if (segsClear(L, X)) return L;
        const alt = vertical
          ? [pts[0], { x: p.x, y: p2.y }, { x: q2.x, y: p2.y }, { x: q2.x, y: q.y }, { x: q.x, y: q.y }]
          : [pts[0], { x: p2.x, y: p.y }, { x: p2.x, y: q2.y }, { x: q.x, y: q2.y }, { x: q.x, y: q.y }];
        return segsClear(alt, X) ? alt : L;
      }
      return pts;
    }

    // ---- draw ----
    let svg = container.querySelector('svg.dg-overlay');
    if (svg) svg.remove();
    svg = el('svg', { class: 'dg-overlay', width: cRect.width, height: cRect.height,
                      style: 'position:absolute;left:0;top:0;pointer-events:none;overflow:visible' });
    container.style.position = container.style.position || 'relative';
    container.appendChild(svg);
    const stroke = getComputedStyle(container).getPropertyValue('--dg-stroke').trim() || '#546170';
    const halo = getComputedStyle(container).getPropertyValue('--dg-bg').trim() || '#ffffff';

    let placedLabels = [], labelJobs = [];
    edges.forEach(e => {
      if (e._skip) return;
      const raw = route(e);
      const pts = raw.map(pt => ({ x: pt.x, y: pt.y }));
      // pull endpoint back so the arrowhead tip, not the line, touches the border
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      const ang = Math.atan2(last.y - prev.y, last.x - prev.x);
      const tip = { x: last.x, y: last.y };
      last.x -= Math.cos(ang) * ARROW; last.y -= Math.sin(ang) * ARROW;

      const color = e.color || stroke;
      const path = el('path', {
        d: pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' '),
        fill: 'none', stroke: color, 'stroke-width': 1.6,
        'stroke-dasharray': e.style === 'dashed' ? '6 4' : 'none'
      });
      svg.appendChild(path);
      // arrowhead
      const a1 = ang + 2.6, a2 = ang - 2.6, AL = ARROW + 3;
      svg.appendChild(el('path', {
        d: 'M' + tip.x + ' ' + tip.y +
           ' L' + (tip.x + Math.cos(a1) * AL) + ' ' + (tip.y + Math.sin(a1) * AL) +
           ' L' + (tip.x + Math.cos(a2) * AL) + ' ' + (tip.y + Math.sin(a2) * AL) + ' Z',
        fill: color
      }));

      // segment-vs-node violation check (on the un-shortened route)
      for (let i = 0; i < raw.length - 1; i++) {
        for (const id2 of ids) {
          if (id2 === e.from || id2 === e.to) continue;
          if (nodes[id2].querySelector('.dg-node')) continue; // skip group containers
          if (segHitsRect(raw[i].x, raw[i].y, raw[i + 1].x, raw[i + 1].y, R[id2], 2))
            warn('edge ' + e.from + '->' + e.to + ' crosses node ' + id2);
        }
      }

      // defer labels so they always paint on top of every edge line
      if (e.label) labelJobs.push({ e, pts, color });
    });

    labelJobs.forEach(({ e, pts, color }) => {
      let bi = 0, bl = -1;
      for (let i = 0; i < pts.length - 1; i++) {
        const L = Math.abs(pts[i + 1].x - pts[i].x) + Math.abs(pts[i + 1].y - pts[i].y);
        if (L > bl) { bl = L; bi = i; }
      }
      if (e.labelAt === 'start') bi = 0;
      const A = pts[bi], B = pts[bi + 1];
      const horizontal = Math.abs(B.y - A.y) < 1;
      const t = el('text', {
        'text-anchor': 'middle', 'dominant-baseline': horizontal ? 'auto' : 'middle',
        'font-size': 12, fill: color,
        stroke: halo, 'stroke-width': 4, 'paint-order': 'stroke fill',
        'stroke-linejoin': 'round', 'font-family': 'inherit'
      });
      t.textContent = e.label;
      svg.appendChild(t);
      const place = (f, dy) => {
        const nx = A.x + (B.x - A.x) * f, ny = A.y + (B.y - A.y) * f;
        t.setAttribute('x', nx);
        t.setAttribute('y', horizontal ? ny + dy : ny);
      };
      const collides = () => {
        const bb = t.getBBox();
        const lr = { x: bb.x - LABEL_PAD, y: bb.y - LABEL_PAD, w: bb.width + 2 * LABEL_PAD, h: bb.height + 2 * LABEL_PAD };
        for (const id2 of ids)
          if (rectsOverlap(lr, R[id2], 0) && !nodes[id2].querySelector('.dg-node')) return true;
        for (const pl of placedLabels) if (rectsOverlap(lr, pl, 2)) return true;
        return false;
      };
      // candidate spots: midpoint above the line, then slide along it, then below it
      const spots = e.labelAt === 'start'
        ? [[0.35, -7], [0.35, 16], [0.5, -7], [0.5, 16]]
        : [[0.5, -7], [0.7, -7], [0.3, -7], [0.5, 16], [0.7, 16], [0.3, 16], [0.8, -7], [0.2, -7]];
      let ok = false;
      for (const [f, dy] of spots) { place(f, dy); if (!collides()) { ok = true; break; } }
      if (!ok) { place(spots[0][0], spots[0][1]); warn('label "' + e.label + '" overlaps another element'); }
      const fb = t.getBBox();
      placedLabels.push({ x: fb.x, y: fb.y, w: fb.width, h: fb.height });
    });
  }

  /* ---------------- sequence diagrams ---------------- */
  function renderSequence(container) {
    const spec = JSON.parse(container.querySelector('script.dg-seq').textContent);
    const font = '13px ' + (getComputedStyle(container).fontFamily || 'system-ui, sans-serif');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = font;
    const tw = s => ctx.measureText(s).width;

    const P = spec.participants, M = spec.messages;
    const idx = {}; P.forEach((p, i) => idx[p.id] = i);
    const boxW = P.map(p => Math.max(96, tw(p.label) + 28));
    const boxH = 34, ROW = 40, TOP = 14, MARGIN = 16, BAR = 10;

    // lifeline x positions: gap driven by the widest label between adjacent pairs
    const gapNeed = new Array(P.length - 1).fill(120);
    M.forEach(m => {
      if (m.type === 'note' || m.from === m.to) return;
      const a = Math.min(idx[m.from], idx[m.to]), b = Math.max(idx[m.from], idx[m.to]);
      const per = (tw(m.label || '') + 50) / (b - a);
      for (let i = a; i < b; i++) gapNeed[i] = Math.max(gapNeed[i], per);
    });
    const X = [MARGIN + boxW[0] / 2];
    for (let i = 1; i < P.length; i++)
      X[i] = X[i - 1] + Math.max(gapNeed[i - 1], boxW[i - 1] / 2 + boxW[i] / 2 + 40);

    // rows
    let y = TOP + boxH + 24;
    const rows = M.map(m => {
      const r = y;
      y += (m.from === m.to) ? ROW * 1.4 : (m.type === 'note' ? ROW * 1.1 : ROW);
      return r;
    });
    const H = y + 30 + boxH;
    // canvas must also fit right-hanging self-message and note labels
    let W = X[P.length - 1] + boxW[P.length - 1] / 2 + MARGIN + 40;
    M.forEach(m => {
      if (m.type === 'note') W = Math.max(W, X[idx[m.at]] + 16 + tw(m.label) + 20 + MARGIN);
      else if (m.from === m.to) W = Math.max(W, X[idx[m.from]] + BAR / 2 + 42 + tw(m.label) + MARGIN);
    });

    const stroke = getComputedStyle(container).getPropertyValue('--dg-stroke').trim() || '#546170';
    const accent = getComputedStyle(container).getPropertyValue('--dg-accent').trim() || '#eef2f7';
    const halo = getComputedStyle(container).getPropertyValue('--dg-bg').trim() || '#ffffff';
    const svg = el('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H,
                            style: 'max-width:100%;height:auto;display:block', 'font-family': 'inherit' });
    container.appendChild(svg);

    // activation tracking: open bar on callee at call, close on matching return
    const bars = []; const open = {};
    M.forEach((m, i) => {
      if (m.type === 'note') return;
      if (m.style === 'return') {
        const k = m.from; // returning participant closes its bar
        if (open[k] !== undefined) { bars.push({ p: k, y1: open[k], y2: rows[i] }); delete open[k]; }
      } else if (m.from !== m.to && open[m.to] === undefined) open[m.to] = rows[i];
    });
    for (const k in open) bars.push({ p: k, y1: open[k], y2: rows[rows.length - 1] + 20 });

    // lifelines + participant boxes (top and bottom)
    P.forEach((p, i) => {
      svg.appendChild(el('line', { x1: X[i], y1: TOP + boxH, x2: X[i], y2: H - boxH - 6,
                                   stroke: stroke, 'stroke-dasharray': '4 4', 'stroke-width': 1 }));
      [TOP, H - boxH].forEach(by => {
        svg.appendChild(el('rect', { x: X[i] - boxW[i] / 2, y: by, width: boxW[i], height: boxH,
                                     rx: 6, fill: accent, stroke: stroke, 'stroke-width': 1.2 }));
        const t = el('text', { x: X[i], y: by + boxH / 2, 'text-anchor': 'middle',
                               'dominant-baseline': 'central', 'font-size': 13, 'font-weight': 600, fill: '#26313c' });
        t.textContent = p.label; svg.appendChild(t);
      });
    });
    bars.forEach(b => {
      const i = idx[b.p];
      svg.appendChild(el('rect', { x: X[i] - BAR / 2, y: b.y1 - 6, width: BAR, height: b.y2 - b.y1 + 12,
                                   fill: accent, stroke: stroke, 'stroke-width': 1 }));
    });

    function arrowhead(x, y, dirRight, color) {
      const s = dirRight ? -1 : 1;
      svg.appendChild(el('path', { d: 'M' + x + ' ' + y + ' l' + (9 * s) + ' -4.5 l0 9 Z', fill: color }));
    }
    M.forEach((m, i) => {
      const yy = rows[i];
      if (m.type === 'note') {
        const i0 = idx[m.at], w = tw(m.label) + 20;
        svg.appendChild(el('rect', { x: X[i0] + 16, y: yy - 12, width: w, height: 24, fill: '#fff8dc', stroke: '#c8b464', 'stroke-width': 1 }));
        const t = el('text', { x: X[i0] + 16 + w / 2, y: yy, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 12, fill: '#5a4d1a' });
        t.textContent = m.label; svg.appendChild(t);
        return;
      }
      const from = idx[m.from], to = idx[m.to];
      const dashed = m.style === 'return' || m.style === 'dashed';
      if (from === to) { // self message
        const x0 = X[from] + BAR / 2;
        svg.appendChild(el('path', { d: 'M' + x0 + ' ' + yy + ' h 34 v 22 h -34',
          fill: 'none', stroke: stroke, 'stroke-width': 1.4, 'stroke-dasharray': dashed ? '5 4' : 'none' }));
        arrowhead(x0 + 1, yy + 22, false, stroke);
        const t = el('text', { x: x0 + 42, y: yy + 11, 'font-size': 12, fill: '#3a4653', 'dominant-baseline': 'central',
                               stroke: halo, 'stroke-width': 4, 'paint-order': 'stroke fill', 'stroke-linejoin': 'round' });
        t.textContent = m.label; svg.appendChild(t);
        return;
      }
      const right = to > from;
      const barAdj = p => bars.some(b => idx[b.p] === p && yy >= b.y1 - 6 && yy <= b.y2 + 6) ? BAR / 2 : 0;
      const x1 = X[from] + (right ? barAdj(from) : -barAdj(from));
      const x2 = X[to] + (right ? -(barAdj(to) + 10) : (barAdj(to) + 10));
      svg.appendChild(el('line', { x1: x1, y1: yy, x2: x2, y2: yy, stroke: stroke, 'stroke-width': 1.4,
                                   'stroke-dasharray': dashed ? '5 4' : 'none' }));
      arrowhead(x2 + (right ? 10 : -10) * 0 + (right ? 1 : -1), yy, right, stroke);
      const t = el('text', { x: (x1 + x2) / 2, y: yy - 8, 'text-anchor': 'middle', 'font-size': 12, fill: '#3a4653',
                             stroke: halo, 'stroke-width': 4, 'paint-order': 'stroke fill', 'stroke-linejoin': 'round' });
      t.textContent = m.label; svg.appendChild(t);
    });
  }

  function renderAll() {
    document.querySelectorAll('[data-diagram]').forEach(renderDiagram);
    document.querySelectorAll('[data-sequence]').forEach(c => {
      if (!c.querySelector('svg')) renderSequence(c);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderAll);
  else renderAll();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    document.querySelectorAll('[data-diagram]').forEach(renderDiagram); }, 150); });
})();

</script>
</body>
</html>
