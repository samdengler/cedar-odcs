# Written by hand: the HR system has no catalog this project reads, so
# there is no contract/unity/ and no pull. cedar-odcs build reads this file.
apiVersion: v3.2.0
kind: DataContract
id: 5e2a9c41-7b3d-4f0e-a6d8-2c1b9e4f7a30
name: hr.employees
version: 1.0.0
status: active
domain: hr
description:
  purpose: Employee records as served by the HR API
schema:
- name: Employee
  description: One employee's record; the record is the employee
  properties:
  - name: employeeId
    logicalType: string
    required: true
    classification: public
    customProperties:
    - property: writer
      value: system
    - property: cedarEntityType
      value: User
    description: The employee, as the token's subject names them
  - name: name
    logicalType: string
    required: true
    classification: public
    customProperties:
    - property: writer
      value: hr
    description: Legal name; a change needs documents HR checks
  - name: workEmail
    logicalType: string
    required: true
    classification: public
    customProperties:
    - property: writer
      value: system
    description: Work email address
  - name: jobTitle
    logicalType: string
    required: true
    classification: public
    customProperties:
    - property: writer
      value: hr
    description: Job title
  - name: department
    logicalType: string
    required: true
    classification: public
    customProperties:
    - property: writer
      value: hr
    description: Department
  - name: manager
    logicalType: string
    required: false
    classification: public
    customProperties:
    - property: writer
      value: hr
    - property: cedarEntityType
      value: User
    description: The employee's manager, as their token's subject names them; absent at the top of the chart
  - name: homeAddress
    logicalType: object
    required: false
    properties:
    - name: line1
      logicalType: string
      required: true
      classification: confidential
      customProperties:
      - property: writer
        value: owner
    - name: line2
      logicalType: string
      required: false
      classification: confidential
      customProperties:
      - property: writer
        value: owner
    - name: city
      logicalType: string
      required: true
      classification: confidential
      customProperties:
      - property: writer
        value: owner
    - name: region
      logicalType: string
      required: false
      classification: confidential
      customProperties:
      - property: writer
        value: owner
    - name: postalCode
      logicalType: string
      required: true
      classification: confidential
      customProperties:
      - property: writer
        value: owner
    - name: country
      logicalType: string
      required: true
      classification: confidential
      customProperties:
      - property: writer
        value: owner
    description: Home address, where tax forms and mail go
  - name: personalPhone
    logicalType: string
    required: false
    classification: confidential
    customProperties:
    - property: writer
      value: owner
    description: Personal phone number
  - name: salary
    logicalType: number
    required: true
    classification: confidential
    customProperties:
    - property: writer
      value: system
    description: Annual base salary; set by the compensation process
  - name: hrNotes
    logicalType: string
    required: false
    classification: internal
    customProperties:
    - property: writer
      value: hr
    description: Notes HR keeps on the employee
  - name: bankAccount
    logicalType: string
    required: true
    classification: restricted
    customProperties:
    - property: writer
      value: system
    description: Where pay is deposited; changed only in the payroll portal
