# Test harness for the whole repo: lets `uv run pytest -v` at the root
# collect every iteration's corpus runner. Each iteration directory has
# its own pyproject.toml and remains runnable on its own.
[project]
name = "cedar-odcs"
version = "0.2.6"
description = "Data governance for agent tool calls with Cedar policies"
requires-python = ">=3.10"
# cedar_odcs/ and the cedar-odcs command need these; the numbered
# iterations carry their own copies in their own projects.
dependencies = [
    "cedarpy>=4.0",
    "open-data-contract-standard>=3.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
cedar-odcs = "cedar_odcs.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cedar_odcs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Every iteration names its corpus runner test_corpus.py. The default
# import mode cannot hold two modules with the same basename; importlib
# mode keys modules by path instead.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
